name: Recover blocked Pages deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/recover-pages.yml]

permissions: {}

concurrency:
  group: recover-pages
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'Viktor-gym/gym-pwa'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      pages: write
      actions: write
    steps:
      - name: Clear the known stale Pages lock and retry once
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const repo = context.repo;
            const blocked = 'a67ae99147b7b0a7461f01f7387eba3b51a5b54f';
            // Cancel only the deployment named in both failed deploy logs.
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                ...repo, pages_deployment_id: blocked
              });
              core.info(`Cancellation requested for ${blocked}`);
            } catch (error) {
              if (error.status === 404) {
                core.warning('The stale deployment was not found; checking the new publish without cancelling anything else.');
              } else if (error.status === 400 && /as it's finished\.?$/.test(error.message)) {
                const status = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                  ...repo, pages_deployment_id: blocked
                });
                const terminal = ['succeed', 'deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'];
                if (!terminal.includes(status.data.status)) throw error;
                core.info(`The stale deployment has already finished: ${status.data.status}`);
              } else {
                throw error;
              }
            }

            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            let retried = false;
            let run;
            // Wait for the branch-based Pages run for THIS commit only.
            for (let attempt = 0; attempt < 60; attempt++) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                ...repo, head_sha: context.sha, per_page: 30
              });
              run = response.data.workflow_runs.find(candidate =>
                candidate.name === 'pages build and deployment');
              if (run?.status === 'completed') {
                if (run.conclusion === 'success') {
                  await core.summary.addHeading('Pages publication recovered')
                    .addLink('Successful Pages run', run.html_url).write();
                  return;
                }
                if (!retried && run.conclusion === 'failure') {
                  const jobs = await github.rest.actions.listJobsForWorkflowRun({
                    ...repo, run_id: run.id, per_page: 100
                  });
                  const failed = jobs.data.jobs.filter(job => job.conclusion === 'failure');
                  if (failed.length !== 1 || failed[0].name !== 'deploy') {
                    throw new Error(`Not retrying a non-deployment failure: ${run.html_url}`);
                  }
                  await github.rest.actions.reRunWorkflowFailedJobs({...repo, run_id: run.id});
                  retried = true;
                  core.info(`Retried failed deployment once: ${run.html_url}`);
                  // Allow the rerun status to propagate before polling again.
                  await sleep(15000);
                } else {
                  throw new Error(`Pages still failed after recovery: ${run.html_url}`);
                }
              }
              await sleep(10000);
            }
            throw new Error(`Pages did not finish within the recovery window: ${run?.html_url || context.sha}`);
